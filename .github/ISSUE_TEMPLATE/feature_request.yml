name: Feature Request
description: 为随机抽数系统提出新功能或改进建议
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法！请先说明使用场景，再描述期望的交互或效果。

  - type: textarea
    id: problem
    attributes:
      label: 这个功能解决什么问题？
      description: 描述当前的不便或限制。
      placeholder: 例如：课堂上需要按小组抽取，但现在只能逐个号码抽。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？
      placeholder: 例如：增加“按组抽取”，每组显示为一个号码球。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有其他做法？为什么不用它们？

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考链接或其他上下文。
